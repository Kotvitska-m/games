<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нейро-Память — Игра</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Baloo+2:wght@700;800&display=swap');
  :root{--bg:#f0f4ff;--card:#fff;--primary:#3b5bdb;--accent:#f59f00;--green:#2f9e44;--red:#e03131;--text:#1a1a2e;--muted:#6c7a9c;--border:#d0d9f0;--shadow:0 4px 24px rgba(59,91,219,.10);--radius:16px}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

  header{background:var(--primary);color:#fff;padding:18px 24px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(59,91,219,.3)}
  header h1{font-family:'Baloo 2',cursive;font-size:1.7rem;letter-spacing:-.5px}
  header h1 span{color:var(--accent)}
  .badge{background:var(--accent);color:#1a1a2e;font-weight:800;font-size:.75rem;padding:3px 10px;border-radius:20px;letter-spacing:.5px}

  .mode-tabs{display:flex;gap:10px;padding:20px 24px 0;max-width:960px;margin:0 auto}
  .tab{flex:1;padding:12px;border:2.5px solid var(--border);border-radius:12px;background:var(--card);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(59,91,219,.3)}
  .tab:hover:not(.active){border-color:var(--primary);color:var(--primary)}

  main{max-width:960px;margin:20px auto 40px;padding:0 24px}
  .panel{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1.5px solid var(--border)}

  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  label{font-weight:700;font-size:.9rem;color:var(--muted)}
  select,button{font-family:'Nunito',sans-serif;font-size:.95rem;border-radius:10px;border:2px solid var(--border);padding:8px 14px;background:var(--bg);color:var(--text);cursor:pointer;font-weight:700;transition:all .18s}
  select:focus,button:focus{outline:none;border-color:var(--primary)}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);padding:10px 22px;box-shadow:0 3px 10px rgba(59,91,219,.2)}
  .btn-primary:hover{background:#2f4abf}
  .btn-accent{background:var(--accent);color:#1a1a2e;border-color:var(--accent)}
  .btn-accent:hover{background:#e08d00}
  .btn-green{background:var(--green);color:#fff;border-color:var(--green)}

  .grid-wrap{display:flex;justify-content:center;overflow-x:auto;margin:0 auto}
  .grid{display:grid;gap:6px}
  .cell{width:64px;height:64px;border:2.5px solid var(--border);border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:transform .15s;position:relative;overflow:hidden;flex-shrink:0}
  .cell svg{width:38px;height:38px}
  .cell.draggable{cursor:grab;border-color:var(--primary);background:#eef1ff}
  .cell.draggable:active{cursor:grabbing;transform:scale(1.07)}
  .cell.drop-target{border:2.5px dashed var(--primary);background:#d8e0ff}
  .cell.correct{border-color:var(--green)!important;background:#d3f9d8!important}
  .cell.wrong{border-color:var(--red)!important;background:#ffe3e3!important}
  .cell.empty-slot{border:2.5px dashed #bbb;background:#f8f9ff;cursor:default}

  .phase-banner{text-align:center;padding:12px 0 10px;font-size:1.1rem;font-weight:700;color:var(--muted)}
  .phase-banner strong{color:var(--primary);font-size:1.3rem}
  #timer-display{font-family:'Baloo 2',cursive;font-size:2.5rem;color:var(--primary);text-align:center;margin:4px 0 12px;transition:color .3s}
  #timer-display.urgent{color:var(--red);animation:pulse .4s infinite alternate}
  @keyframes pulse{to{transform:scale(1.08)}}

  .feedback{margin-top:16px;padding:14px 18px;border-radius:12px;font-weight:700;text-align:center;font-size:1.1rem;display:none}
  .feedback.show{display:block}
  .feedback.win{background:#d3f9d8;color:var(--green);border:2px solid var(--green)}
  .feedback.lose{background:#ffe3e3;color:var(--red);border:2px solid var(--red)}

  .section-title{font-weight:800;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
  .tray{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:var(--bg);border:2px dashed var(--border);border-radius:12px;min-height:82px}
  .tray-info{font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:6px}

  /* Print preview */
  .print-grid-wrap{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
  .print-card{text-align:center}
  .print-card h3{font-family:'Baloo 2',cursive;font-size:.95rem;color:var(--primary);margin-bottom:8px}
  .print-empty-cell{border:2px solid #444!important;background:#fff!important}

  footer{text-align:center;padding:16px;color:var(--muted);font-size:.85rem;font-weight:700;letter-spacing:.3px}
  footer span{color:var(--primary)}

  .hint{font-size:.82rem;color:var(--muted);margin-bottom:14px;line-height:1.5}

  @media(max-width:500px){
    .cell{width:52px;height:52px}
    .cell svg{width:30px;height:30px}
    main{padding:0 10px}
    .panel{padding:14px}
  }
</style>
</head>
<body>

<header>
  <h1>🧠 Нейро-<span>Память</span></h1>
  <span class="badge">BRAIN GAME</span>
</header>

<div class="mode-tabs">
  <button class="tab active" id="tab-online" onclick="switchMode('online')">🎮 Онлайн-игра</button>
  <button class="tab" id="tab-print"  onclick="switchMode('print')">🖨️ Для печати</button>
</div>

<main>

  <!-- ══ ONLINE MODE ══ -->
  <div id="panel-online" class="panel">
    <div class="controls">
      <label>Сложность:</label>
      <select id="online-size">
        <option value="4">4 × 4</option>
        <option value="5" selected>5 × 5</option>
        <option value="6">6 × 6</option>
      </select>
      <label>Время:</label>
      <select id="online-time">
        <option value="5">5 сек</option>
        <option value="10" selected>10 сек</option>
        <option value="15">15 сек</option>
        <option value="20">20 сек</option>
      </select>
      <button class="btn-primary" onclick="startOnline()">▶ Новая игра</button>
    </div>

    <div class="phase-banner" id="online-phase">Нажми <strong>Новая игра</strong>, чтобы начать!</div>
    <div id="timer-display" style="display:none"></div>

    <!-- Запоминание -->
    <div class="grid-wrap" id="online-grid-wrap">
      <div class="grid" id="online-grid"></div>
    </div>

    <!-- Воспроизведение -->
    <div id="recall-area" style="display:none">
      <div class="section-title">Расставь символы в правильный порядок:</div>
      <div class="grid-wrap">
        <div class="grid" id="answer-grid"></div>
      </div>
      <div class="section-title" style="margin-top:18px">Символы для расстановки:</div>
      <div class="tray-info" id="tray-info"></div>
      <div class="tray" id="symbol-tray"></div>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn-green" onclick="checkAnswer()">✔ Проверить</button>
        <button onclick="revealAnswer()">👁 Показать ответ</button>
        <button class="btn-primary" onclick="startOnline()">🔄 Ещё раз</button>
      </div>
    </div>

    <div class="feedback" id="online-feedback"></div>
  </div>

  <!-- ══ PRINT MODE ══ -->
  <div id="panel-print" class="panel" style="display:none">
    <div class="controls">
      <label>Сложность:</label>
      <select id="print-size">
        <option value="4">4 × 4</option>
        <option value="5" selected>5 × 5</option>
        <option value="6">6 × 6</option>
      </select>
      <label>Карточек:</label>
      <select id="print-count">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="4">4</option>
        <option value="6">6</option>
      </select>
      <button class="btn-primary" onclick="generatePrint()">⚡ Сгенерировать</button>
      <button class="btn-accent" id="btn-print" onclick="doPrint()">🖨️ Печать</button>
    </div>
    <p class="hint">💡 Для каждой карточки генерируется пара: сетка с символами (запоминай) + пустая сетка (рисуй по памяти)</p>
    <div id="print-area" class="print-grid-wrap"></div>
  </div>

</main>

<footer>Разработано для <span>Котвицкой</span> • Нейро-Память 🧠</footer>

<script>
// ══ SYMBOL LIBRARY ══
const SYM = [
  {id:'dots3',  f:()=>mk([d(10,24),d(24,24),d(38,24)])},
  {id:'dot1',   f:()=>mk([d(24,24)])},
  {id:'dot2',   f:()=>mk([d(16,24),d(32,24)])},
  {id:'n3',     f:()=>nu('3')},
  {id:'n8',     f:()=>nu('8')},
  {id:'n5',     f:()=>nu('5')},
  {id:'n2',     f:()=>nu('2')},
  {id:'n7',     f:()=>nu('7')},
  {id:'hash',   f:()=>mk([l(16,8,16,40),l(32,8,32,40),l(8,18,40,18),l(8,30,40,30)])},
  {id:'arrup',  f:()=>mk([pg('24,8 36,28 12,28')])},
  {id:'arrdn',  f:()=>mk([pg('24,40 12,20 36,20')])},
  {id:'circle', f:()=>mk([ci(24,24,14)])},
  {id:'sun',    f:()=>sunF()},
  {id:'zigzag', f:()=>mk([pl('8,20 16,32 24,20 32,32 40,20')])},
  {id:'wave',   f:()=>mk([pa('M8,24 Q14,12 20,24 Q26,36 32,24 Q38,12 44,24')])},
  {id:'s',      f:()=>nu('S')},
  {id:'xcircle',f:()=>mk([ci(24,24,14),l(14,14,34,34),l(34,14,14,34)])},
  {id:'tri',    f:()=>mk([pg('24,8 42,36 6,36')])},
  {id:'tridn',  f:()=>mk([pg('24,40 6,12 42,12')])},
  {id:'cross',  f:()=>mk([l(24,8,24,40),l(8,24,40,24)])},
  {id:'square', f:()=>mk([rc(10,10,28,28)])},
  {id:'star',   f:()=>starF()},
  {id:'diamond',f:()=>mk([pg('24,6 42,24 24,42 6,24')])},
  {id:'moon',   f:()=>mk([pa('M30,10 a14,14 0 1,0 0,28 a10,10 0 1,1 0,-28')])},
  {id:'eye',    f:()=>mk([pa('M8,24 Q24,8 40,24 Q24,40 8,24Z'),ci(24,24,6)])},
  {id:'spiral', f:()=>mk([pa('M24,14 a10,10 0 1,0 10,10 a5,5 0 1,1 -5,-5')])},
  {id:'n6',     f:()=>nu('6')},
  {id:'n4',     f:()=>nu('4')},
  {id:'n9',     f:()=>nu('9')},
  {id:'n1',     f:()=>nu('1')},
];

function mk(s){return`<svg viewBox="0 0 48 48" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${s.join('')}</svg>`}
function d(x,y){return`<circle cx="${x}" cy="${y}" r="4" fill="#1a1a2e"/>`}
function l(x1,y1,x2,y2){return`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}
function ci(cx,cy,r){return`<circle cx="${cx}" cy="${cy}" r="${r}"/>`}
function pg(p){return`<polygon points="${p}"/>`}
function pl(p){return`<polyline points="${p}"/>`}
function rc(x,y,w,h){return`<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`}
function pa(d){return`<path d="${d}"/>`}
function nu(c){return`<svg viewBox="0 0 48 48" fill="none"><text x="24" y="34" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900" font-size="30" fill="#1a1a2e">${c}</text></svg>`}
function sunF(){
  const ls=[];
  for(let i=0;i<8;i++){const a=i*45*Math.PI/180;ls.push(l((24+12*Math.cos(a)).toFixed(1),(24+12*Math.sin(a)).toFixed(1),(24+20*Math.cos(a)).toFixed(1),(24+20*Math.sin(a)).toFixed(1)))}
  return mk([ci(24,24,9),...ls])
}
function starF(){
  let pts='';
  for(let i=0;i<10;i++){const r=i%2===0?18:8,a=(i*36-90)*Math.PI/180;pts+=(24+r*Math.cos(a)).toFixed(1)+','+(24+r*Math.sin(a)).toFixed(1)+' '}
  return mk([pg(pts.trim())])
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}

// Pick N symbols with unique instance IDs (allows repeats for large grids)
function pickSymbols(n){
  const pool=shuffle([...SYM]);
  const res=[];
  for(let i=0;i<n;i++){
    const base=pool[i%pool.length];
    res.push({uid:base.id+'_'+i, baseId:base.id, svg:base.f});
  }
  return shuffle(res);
}

// ══ MODE SWITCH ══
function switchMode(m){
  document.getElementById('panel-online').style.display=m==='online'?'':'none';
  document.getElementById('panel-print').style.display=m==='print'?'':'none';
  document.getElementById('tab-online').classList.toggle('active',m==='online');
  document.getElementById('tab-print').classList.toggle('active',m==='print');
  if(m==='print' && !lastPrintData.length) generatePrint();
}

// ══ ONLINE GAME ══
let onlineAnswer=[], onlineSize=5, timerInt=null, dragSrc=null, touchCell=null;

function startOnline(){
  clearInterval(timerInt);
  onlineSize=+document.getElementById('online-size').value;
  const secs=+document.getElementById('online-time').value;
  const total=onlineSize*onlineSize;
  onlineAnswer=pickSymbols(total);

  document.getElementById('recall-area').style.display='none';
  document.getElementById('online-feedback').className='feedback';
  document.getElementById('timer-display').style.display='block';
  document.getElementById('online-grid-wrap').style.display='flex';

  const gEl=document.getElementById('online-grid');
  gEl.innerHTML='';
  gEl.style.gridTemplateColumns=`repeat(${onlineSize},64px)`;
  onlineAnswer.forEach(sym=>{
    const c=document.createElement('div');
    c.className='cell';c.innerHTML=sym.svg();gEl.appendChild(c);
  });

  document.getElementById('online-phase').innerHTML=`👀 Запоминай! Осталось: <strong id="csec">${secs}</strong> сек`;
  let left=secs;
  updateTimer(left);
  timerInt=setInterval(()=>{
    left--;updateTimer(left);
    const cs=document.getElementById('csec');if(cs)cs.textContent=left;
    if(left<=0){clearInterval(timerInt);startRecall();}
  },1000);
}

function updateTimer(v){
  const el=document.getElementById('timer-display');
  el.textContent=v;el.classList.toggle('urgent',v<=3);
}

function startRecall(){
  document.getElementById('online-grid-wrap').style.display='none';
  document.getElementById('timer-display').style.display='none';
  document.getElementById('online-phase').innerHTML='🧩 Расставь символы в правильном порядке!';

  // Build answer slots
  const ag=document.getElementById('answer-grid');
  ag.innerHTML='';ag.style.gridTemplateColumns=`repeat(${onlineSize},64px)`;
  for(let i=0;i<onlineAnswer.length;i++){
    const slot=document.createElement('div');
    slot.className='cell empty-slot';slot.dataset.index=i;
    slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('drop-target');});
    slot.addEventListener('dragleave',()=>slot.classList.remove('drop-target'));
    slot.addEventListener('drop',e=>{e.preventDefault();slot.classList.remove('drop-target');dropToSlot(slot);});
    slot.addEventListener('touchend',e=>{e.preventDefault();touchDropSlot(slot);},{passive:false});
    ag.appendChild(slot);
  }

  // Build tray — shuffled differently from answer
  const tray=document.getElementById('symbol-tray');
  tray.innerHTML='';
  shuffle([...onlineAnswer]).forEach(sym=>tray.appendChild(makeDrag(sym)));

  updateTrayInfo();
  document.getElementById('recall-area').style.display='block';
  document.getElementById('online-feedback').className='feedback';
}

function makeDrag(sym){
  const c=document.createElement('div');
  c.className='cell draggable';c.draggable=true;c.dataset.uid=sym.uid;c.innerHTML=sym.svg();
  c.addEventListener('dragstart',()=>{dragSrc=c;setTimeout(()=>c.style.opacity='.4',0);});
  c.addEventListener('dragend',()=>{c.style.opacity='1';dragSrc=null;});
  c.addEventListener('touchstart',()=>{touchCell=c;c.style.opacity='.5';},{passive:true});
  c.addEventListener('touchend',()=>{c.style.opacity='1';},{passive:false});
  return c;
}

function dropToSlot(slot){
  if(!dragSrc)return;
  const existing=slot.querySelector('[data-uid]');
  if(existing)document.getElementById('symbol-tray').appendChild(existing);
  slot.classList.remove('empty-slot','correct','wrong','drop-target');
  dragSrc.style.opacity='1';
  slot.appendChild(dragSrc);
  dragSrc=null;
  updateTrayInfo();
}

function touchDropSlot(slot){
  if(!touchCell)return;
  const existing=slot.querySelector('[data-uid]');
  if(existing)document.getElementById('symbol-tray').appendChild(existing);
  slot.classList.remove('empty-slot','correct','wrong');
  touchCell.style.opacity='1';
  slot.appendChild(touchCell);
  touchCell=null;
  updateTrayInfo();
}

function updateTrayInfo(){
  const n=document.getElementById('symbol-tray').children.length;
  const total=onlineAnswer.length;
  const placed=total-n;
  document.getElementById('tray-info').textContent=
    `Размещено: ${placed} из ${total} • Осталось в лотке: ${n}`;
}

function checkAnswer(){
  const slots=document.getElementById('answer-grid').querySelectorAll('.cell');
  let ok=0;
  slots.forEach((slot,i)=>{
    const p=slot.querySelector('[data-uid]');
    slot.classList.remove('correct','wrong');
    if(!p){slot.classList.add('wrong');return;}
    if(p.dataset.uid===onlineAnswer[i].uid){slot.classList.add('correct');ok++;}
    else slot.classList.add('wrong');
  });
  const total=onlineAnswer.length;
  const fb=document.getElementById('online-feedback');
  fb.className='feedback show '+(ok===total?'win':'lose');
  fb.textContent=ok===total
    ?`🎉 Отлично! Все ${total} символов верно!`
    :`${ok} из ${total} (${Math.round(ok/total*100)}%) верно. Попробуй ещё!`;
}

function revealAnswer(){
  const ag=document.getElementById('answer-grid');
  ag.innerHTML='';ag.style.gridTemplateColumns=`repeat(${onlineSize},64px)`;
  onlineAnswer.forEach(sym=>{
    const c=document.createElement('div');c.className='cell correct';c.innerHTML=sym.svg();ag.appendChild(c);
  });
  document.getElementById('symbol-tray').innerHTML='';
  updateTrayInfo();
  const fb=document.getElementById('online-feedback');
  fb.className='feedback show lose';
  fb.textContent='👁 Вот правильный порядок. Запомни — и попробуй снова!';
}

// ══ PRINT MODE ══
let lastPrintData=[];

function generatePrint(){
  const size=+document.getElementById('print-size').value;
  const count=+document.getElementById('print-count').value;
  const area=document.getElementById('print-area');
  area.innerHTML='';lastPrintData=[];

  for(let c=0;c<count;c++){
    const syms=pickSymbols(size*size);
    lastPrintData.push({size,syms});

    // Filled card
    const cf=document.createElement('div');cf.className='print-card';
    cf.innerHTML=`<h3>Карточка ${c+1} — Запоминай</h3>`;
    const gf=document.createElement('div');gf.className='grid';
    gf.style.cssText=`grid-template-columns:repeat(${size},64px);gap:5px`;
    syms.forEach(s=>{const cc=document.createElement('div');cc.className='cell';cc.innerHTML=s.svg();gf.appendChild(cc);});
    cf.appendChild(gf);area.appendChild(cf);

    // Empty card
    const ce=document.createElement('div');ce.className='print-card';
    ce.innerHTML=`<h3>Карточка ${c+1} — Рисуй по памяти</h3>`;
    const ge=document.createElement('div');ge.className='grid';
    ge.style.cssText=`grid-template-columns:repeat(${size},64px);gap:5px`;
    for(let i=0;i<size*size;i++){const cc=document.createElement('div');cc.className='cell print-empty-cell';ge.appendChild(cc);}
    ce.appendChild(ge);area.appendChild(ce);
  }
}

// ══ PRINT — работает через download-ссылку (не требует разрешения на popup) ══
function doPrint(){
  if(!lastPrintData.length){generatePrint();}

  let cardsHtml='';
  lastPrintData.forEach(({size,syms},idx)=>{
    let filled='',empty='';
    syms.forEach(s=>{filled+=`<div class="cell">${s.svg()}</div>`;});
    for(let i=0;i<size*size;i++)empty+=`<div class="cell emp"></div>`;
    cardsHtml+=`
    <div class="pair">
      <div class="card"><div class="title">Карточка ${idx+1} — Запоминай</div>
        <div class="grid" style="grid-template-columns:repeat(${size},68px)">${filled}</div></div>
      <div class="card"><div class="title">Карточка ${idx+1} — Рисуй по памяти</div>
        <div class="grid" style="grid-template-columns:repeat(${size},68px)">${empty}</div></div>
    </div>`;
  });

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Нейро-Память</title>
<style>
body{font-family:Arial,sans-serif;background:#fff;padding:16px;margin:0}
.noprint{text-align:center;margin-bottom:20px}
.noprint button{padding:10px 28px;font-size:1rem;font-weight:bold;background:#3b5bdb;color:#fff;border:none;border-radius:10px;cursor:pointer}
h2{text-align:center;font-size:1.3rem;margin-bottom:4px}
.sub{text-align:center;color:#666;font-size:.9rem;margin-bottom:20px}
.pair{display:flex;gap:36px;justify-content:center;flex-wrap:wrap;margin-bottom:32px;page-break-inside:avoid;break-inside:avoid}

  try{
    const blob=new Blob([html],{type:'text/html'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.target='_blank';a.rel='noopener';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }catch(e){
    // Fallback: data URI
    const enc='data:text/html;charset=utf-8,'+encodeURIComponent(html);
    window.open(enc,'_blank');
  }
}
